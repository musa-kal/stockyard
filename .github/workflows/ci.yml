# Build and test on GitHub. The full pipeline (images, Terraform, rollout) runs
# in Azure DevOps from azure-pipelines.yml; this mirrors its dotnet stage only.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props

      - run: dotnet restore

      - run: dotnet build --no-restore --configuration Release -warnaserror

      # Integration tests start SQL Server and LocalStack with Testcontainers,
      # which works here because the hosted ubuntu runners ship with Docker.
      - run: dotnet test --no-build --configuration Release
