# Local-only values matching the compose stack. Never reuse these anywhere
# else; the aws overlay gets its secrets from Secrets Manager instead.
apiVersion: v1
kind: Secret
metadata:
  name: stockyard-db
type: Opaque
stringData:
  ConnectionStrings__Stockyard: "Server=host.docker.internal,1433;Database=Stockyard;User Id=sa;Password=Stockyard!Local1;TrustServerCertificate=True"
---
apiVersion: v1
kind: Secret
metadata:
  name: stockyard-signing
type: Opaque
stringData:
  Notifier__SigningSecret: "local-webhook-signing-secret"
