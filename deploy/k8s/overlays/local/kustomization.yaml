# Docker Desktop or kind. Build the images first with the tag "local":
#   docker build -f src/Stockyard.Api/Dockerfile -t stockyard-api:local .
# (and the same for projections, notifier, exporter), then
#   kubectl apply -k deploy/k8s/overlays/local
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - secrets.yaml

images:
  - name: stockyard-api
    newTag: local
  - name: stockyard-projections
    newTag: local
  - name: stockyard-notifier
    newTag: local
  - name: stockyard-exporter
    newTag: local

# SQS and S3 come from the LocalStack container the compose file runs; SQL
# Server is the compose container too, reached through host.docker.internal.
configMapGenerator:
  - name: stockyard-config
    behavior: merge
    envs:
      - local.env

patches:
  - path: localstack-credentials.yaml
    target:
      kind: Deployment
  - path: localstack-credentials.yaml
    target:
      kind: Job
      name: stockyard-migrate
