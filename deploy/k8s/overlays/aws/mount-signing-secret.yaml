- op: add
  path: /spec/template/spec/volumes/-
  value:
    name: secrets-signing
    csi:
      driver: secrets-store.csi.k8s.io
      readOnly: true
      volumeAttributes:
        secretProviderClass: stockyard-signing
- op: add
  path: /spec/template/spec/containers/0/volumeMounts/-
  value:
    name: secrets-signing
    mountPath: /mnt/secrets/signing
    readOnly: true
