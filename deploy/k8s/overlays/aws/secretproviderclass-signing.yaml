# Reads stockyard/dev/signing and syncs it into stockyard-signing for the
# notifier.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: stockyard-signing
spec:
  provider: aws
  parameters:
    region: us-east-1
    objects: |
      - objectName: "stockyard/dev/signing"
        objectType: "secretsmanager"
        jmesPath:
          - path: Notifier__SigningSecret
            objectAlias: Notifier__SigningSecret
  secretObjects:
    - secretName: stockyard-signing
      type: Opaque
      data:
        - objectName: Notifier__SigningSecret
          key: Notifier__SigningSecret
