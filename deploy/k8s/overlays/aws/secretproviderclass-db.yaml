# Reads stockyard/dev/db from Secrets Manager with the pod's IRSA role and
# syncs it into the Kubernetes Secret stockyard-db, which the containers load
# with envFrom. The sync only happens while a pod mounts this class.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: stockyard-db
spec:
  provider: aws
  parameters:
    region: us-east-1
    objects: |
      - objectName: "stockyard/dev/db"
        objectType: "secretsmanager"
        jmesPath:
          - path: ConnectionStrings__Stockyard
            objectAlias: ConnectionStrings__Stockyard
  secretObjects:
    - secretName: stockyard-db
      type: Opaque
      data:
        - objectName: ConnectionStrings__Stockyard
          key: ConnectionStrings__Stockyard
