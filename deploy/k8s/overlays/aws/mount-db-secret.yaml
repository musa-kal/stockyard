# Mounting the class is what makes the CSI driver create stockyard-db, so
# every workload that reads the connection string mounts it.
- op: add
  path: /spec/template/spec/volumes/-
  value:
    name: secrets-db
    csi:
      driver: secrets-store.csi.k8s.io
      readOnly: true
      volumeAttributes:
        secretProviderClass: stockyard-db
- op: add
  path: /spec/template/spec/containers/0/volumeMounts/-
  value:
    name: secrets-db
    mountPath: /mnt/secrets/db
    readOnly: true
