# Nothing in the namespace accepts traffic unless a policy below allows it.
# The workers listen on nothing; only the api takes HTTP on 8080.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: stockyard-api-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: stockyard-api
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
