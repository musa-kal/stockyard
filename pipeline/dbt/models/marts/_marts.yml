version: 2

models:
  - name: dim_item
    description: Items (SKUs) seen in orders or the ledger.
    columns:
      - name: item_sku
        data_tests:
          - unique
          - not_null

  - name: dim_supplier
    description: Suppliers that have posted orders.
    columns:
      - name: supplier_code
        data_tests:
          - unique
          - not_null

  - name: dim_job_site
    description: Job sites, including WAREHOUSE for stock held off site.
    columns:
      - name: job_site_code
        data_tests:
          - unique
          - not_null

  - name: dim_date
    description: Calendar days covering the exported data.
    columns:
      - name: date_day
        data_tests:
          - unique
          - not_null

  - name: fct_purchase_order_lines
    description: One row per purchase order line, as of its latest export.
    columns:
      - name: order_line_key
        data_tests:
          - unique
          - not_null
      - name: supplier_code
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_supplier')
                field: supplier_code
      - name: job_site_code
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_job_site')
                field: job_site_code
      - name: item_sku
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_item')
                field: item_sku
      - name: posted_on
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: quantity_ordered
        data_tests:
          - non_negative
      - name: quantity_received
        data_tests:
          - non_negative
      - name: quantity_outstanding
        description: Ordered minus received. The receive procedure refuses over-receipt, so this never goes below zero.
        data_tests:
          - non_negative
      - name: unit_cost
        data_tests:
          - non_negative

  - name: fct_stock_movements
    description: One row per ledger movement.
    columns:
      - name: movement_id
        data_tests:
          - unique
          - not_null
      - name: item_sku
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_item')
                field: item_sku
      - name: job_site_code
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_job_site')
                field: job_site_code
      - name: occurred_on
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: kind
        data_tests:
          - accepted_values:
              arguments:
                values: ["Receipt", "Issue", "Adjustment", "ReturnToSupplier"]
          - relationships:
              arguments:
                to: ref('movement_kinds')
                field: kind
      - name: kind_code
        description: Null only if the application added a kind the seed does not know yet.
        data_tests:
          - not_null

  - name: fct_daily_stock_balance
    description: Closing stock per item, job site, and day from the first movement onward.
    data_tests:
      - unique:
          arguments:
            column_name: "item_sku || '|' || job_site_code || '|' || cast(date_day as varchar)"
    columns:
      - name: item_sku
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_item')
                field: item_sku
      - name: job_site_code
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_job_site')
                field: job_site_code
      - name: date_day
        data_tests:
          - not_null
